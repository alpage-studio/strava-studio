<!-- ============================================================
     LE RELAIS.

     Ce fichier n'appartient PAS au studio. Il est le contenu entier d'un
     second dépôt, à créer sous l'ancien nom, dont le seul rôle est de
     faire suivre.

     POURQUOI IL EXISTE
     GitHub redirige tout quand on renomme un dépôt — les issues, les
     étoiles, les `git clone` — SAUF une chose, et c'est écrit noir sur
     blanc dans leur documentation : « all existing information, with the
     exception of project site URLs, is automatically redirected ».

     Autrement dit : https://alpage-studio.github.io/strava-studio/ meurt
     le jour du renommage. C'est l'adresse qui a été partagée. Un lien
     partagé ne se reprend pas — il vit dans des messages, des favoris,
     des captures d'écran. On le maintient donc en vie.

     MODE D'EMPLOI
       1. renommer le dépôt du studio (Settings → Repository name) ;
       2. créer un dépôt public neuf portant l'ANCIEN nom ;
       3. y déposer CE fichier, à la racine, sous le nom index.html ;
       4. Settings → Pages → Source : Deploy from a branch → main / (root).

     Le lien d'origine répond alors de nouveau, et amène ici.

     POURQUOI UNE PAGE ET NON UNE REDIRECTION HTTP
     Les pages statiques de GitHub ne servent pas de 301. Un `meta refresh`
     est ce qu'on peut faire de mieux ; on y ajoute le lien en clair, pour
     que quelqu'un qui bloque les redirections voie tout de même où aller,
     et un `canonical` pour que les moteurs suivent.
     ============================================================ -->

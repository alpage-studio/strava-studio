# Contrôles, puis publication.
#
# CE QUE CE FICHIER CHANGE
#   Avant lui, `git push` ÉTAIT la mise en production : GitHub Pages servait la
#   branche telle quelle, une minute plus tard, quoi qu'il y ait dedans. Le
#   harnais ne tournait que si quelqu'un y pensait — et le jour où personne n'y
#   pense, rien ne le dit.
#
#   Ici, la publication est une TÂCHE QUI DÉPEND des contrôles. Un harnais rouge
#   ne publie pas : il n'y a rien à annuler, rien à rattraper, le site en ligne
#   reste celui d'avant.
#
# CONDITION D'ACTIVATION
#   Settings → Pages → Source doit être « GitHub Actions ». Tant qu'il est sur
#   « Deploy from a branch », c'est la branche qui publie et cette tâche échoue :
#   la barrière n'existe pas encore.
#
# LES ACTIONS SONT ÉPINGLÉES À UN COMMIT, pas à une étiquette. Une étiquette se
# déplace ; `actions/checkout@v4` exécute ce que son auteur y met aujourd'hui.
# Le numéro de version est en commentaire pour rester lisible.

name: Contrôles et publication

# `push` sur main seulement, `pull_request` partout ailleurs : une branche
# poussée ET proposée déclencherait sinon deux fois les mêmes contrôles.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Par défaut le jeton ne peut que lire. Les deux permissions d'écriture dont
# Pages a besoin sont demandées par la SEULE tâche qui publie.
permissions:
  contents: read

# UNE CHAINE A LA FOIS PAR BRANCHE.
#   Deux poussees rapprochees lancaient deux chaines completes de dix-huit
#   minutes chacune, pour un resultat dont seule la derniere compte. Sur une
#   proposition, on annule la precedente ; sur main, JAMAIS — interrompre une
#   chaine qui publie laisserait le site dans un etat qu'on n'a pas choisi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harnais:
    name: Harnais et gardes
    runs-on: ubuntu-latest
    # Sans plafond, une tache bloquee tourne six heures — le defaut de GitHub —
    # et garde le verrou de publication tout ce temps. Dix minutes suffisent
    # largement : la derniere execution a pris dix secondes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # la garde de version compare DEUX états du dépôt : il lui faut
          # l'historique, pas seulement le dernier commit
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Aucun `npm install` : le projet n'a pas de dépendance, et le harnais
      # n'en a pas non plus. C'est ce qui rend cette tâche courte.
      - name: Harnais de régression
        run: node tools/test.js

      - name: Secrets et données de position
        run: node tools/garde-secrets.js

      - name: Le numéro de version suit le contenu
        run: |
          # sur une poussée : le commit d'avant ; sur une proposition : la base.
          # Un dépôt neuf ou une branche nouvelle donne 000…0 — la garde le dit
          # et se passe, plutôt que de prétendre avoir comparé quelque chose.
          BASE="${{ github.event.before || github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="origin/main"
          fi
          node tools/garde-version.js "$BASE" "${{ github.sha }}"

  acceptation:
    name: Acceptation (Chromium et WebKit, sans fenêtre)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Playwright s'installe HORS du dépôt, dans le répertoire temporaire du
      # runner : « zéro dépendance » est une règle du produit — ce que
      # télécharge un visiteur — et rien ici n'atterrit dans un fichier servi.
      # DEUX MOTEURS. Chromium ET WebKit — celui de Safari, donc de tout
      # navigateur sur iPhone. Ce n'est pas une precaution de principe : la
      # premiere execution dans WebKit a trouve en trois minutes ce que
      # cinquante-trois cas n'avaient pas vu en plusieurs semaines de Chromium,
      # parce qu'il est plus LENT et qu'un delai fixe y a cede.
      # LES NAVIGATEURS SE GARDENT D'UNE EXECUTION A L'AUTRE.
      #   Chromium et WebKit etaient retelecharges a chaque tache — deux fois
      #   par chaine, environ quatre cents megaoctets — et c'est l'essentiel
      #   des dix-huit minutes. La cle porte le numero de Playwright : changer
      #   de version invalide le cache, ce qui est exactement ce qu'on veut.
      - name: Navigateurs en cache
        id: cache-pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}

      - name: Chromium et WebKit
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.63.0 > /dev/null
          # `--with-deps` installe les bibliotheques systeme, que le cache ne
          # porte pas : on l'appelle meme quand les navigateurs sont deja la.
          npx playwright install --with-deps chromium webkit

      - name: Le parcours réel, deux moteurs, 1280 px puis 390 px
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node tools/acceptation-tete-nue.js --moteur tous

  publication:
    name: Publication sur Pages
    needs: [harnais, acceptation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Une publication à la fois, et on ne coupe pas celle qui est en cours :
    # interrompre un déploiement de Pages au milieu laisse le site dans un état
    # qu'on n'a pas choisi. La contrainte porte sur CETTE tâche — au niveau du
    # workflow, elle ferait aussi la queue aux contrôles des propositions.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Le dépôt entier, comme le faisait la publication par branche : les
      # chemins sont relatifs, `.nojekyll` est à la racine, et tools/ est servi
      # exprès — c'est ce qui permet d'éprouver le SITE EN LIGNE depuis la
      # console d'un navigateur.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '.'

      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verification:
    name: Vérifier ce qui est réellement servi
    needs: publication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # LE CONTROLE DE LA VERSION SERVIE A DEMENAGE DANS LE LANCEUR.
      # Il vivait ici, en dix lignes de shell qui bouclaient sur curl : la
      # meme regle — « attendre que le site serve la version du depot » —
      # ecrite une seconde fois, dans un second langage. Deux ecritures d'une
      # regle finissent par dire deux choses. Le lanceur l'applique avant de
      # lancer le moindre navigateur, et echoue avec un message clair si la
      # propagation n'aboutit pas.
      # LES NAVIGATEURS SE GARDENT D'UNE EXECUTION A L'AUTRE.
      #   Chromium et WebKit etaient retelecharges a chaque tache — deux fois
      #   par chaine, environ quatre cents megaoctets — et c'est l'essentiel
      #   des dix-huit minutes. La cle porte le numero de Playwright : changer
      #   de version invalide le cache, ce qui est exactement ce qu'on veut.
      - name: Navigateurs en cache
        id: cache-pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}

      - name: Chromium et WebKit
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.63.0 > /dev/null
          # `--with-deps` installe les bibliotheques systeme, que le cache ne
          # porte pas : on l'appelle meme quand les navigateurs sont deja la.
          npx playwright install --with-deps chromium webkit

      - name: Le parcours réel, sur le site publié, dans les deux moteurs
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node tools/acceptation-tete-nue.js --moteur tous --url https://alpage-studio.github.io/strava-studio/

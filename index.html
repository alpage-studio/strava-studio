<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strava Studio</title>

<!-- application installable : icône sur l'écran d'accueil, plein écran, hors ligne -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08090B">
<link rel="icon" href="assets/icon-192.png">
<!-- iOS ignore le manifeste pour l'icône et le mode plein écran : il lui faut
     ses propres balises -->
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio">
<style>
  /* Police variable, servie en local : aucun appel réseau, rendu identique
     hors ligne. Axes : graisse 100-900, chasse 62-125 %. */
  @font-face {
    font-family: "Archivo";
    src: url("assets/archivo-latin.woff2") format("woff2");
    font-weight: 100 900; font-stretch: 62% 125%; font-display: block;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
                   U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193,
                   U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Archivo";
    src: url("assets/archivo-latin-ext.woff2") format("woff2");
    font-weight: 100 900; font-stretch: 62% 125%; font-display: block;
    unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB,
                   U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("assets/plexmono-latin.woff2") format("woff2");
    font-weight: 400; font-display: block;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
                   U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212,
                   U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("assets/plexmono-latin-ext.woff2") format("woff2");
    font-weight: 400; font-display: block;
    unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB,
                   U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    --bg:      #08090B;
    --panel:   #0F1114;
    --raised:  #16191E;
    --line:    #22262D;
    --line-2:  #2E333C;
    --ink:     #E9ECF1;
    --mut:     #858C98;
    --acc:     #C8F04E;
    --acc-ink: #14180A;
    --danger:  #FF6B6B;
    --ok:      #6EE7A8;
    --r:       9px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 13.5px/1.5 "Archivo", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- barre de tête ---------- */
  /* En mode plein écran sur iPhone, la barre d'état se superpose à la page :
     on lui réserve sa place, et au socle celle de la barre d'accueil. */
  header {
    flex: none; height: calc(52px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 18px 0;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px;
    background: var(--panel);
  }
  .mark {
    width: 22px; height: 22px; border-radius: 6px; flex: none;
    background: var(--acc);
    -webkit-mask: radial-gradient(circle at 50% 50%, #000 39%, transparent 40%) ,
                  linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  header h1 {
    font-size: 13px; margin: 0; font-weight: 700;
    letter-spacing: .13em; text-transform: uppercase;
  }
  header .sub { color: var(--mut); font-size: 12px; }
  header .spacer { flex: 1; }

  /* ---------- colonnes ---------- */
  main { flex: 1; display: flex; min-height: 0; }

  aside {
    width: 330px; flex: none; background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .scroll { flex: 1; overflow-y: auto; padding: 6px 16px 20px; }
  .scroll::-webkit-scrollbar { width: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 9px; }

  section { padding: 16px 0; border-bottom: 1px solid var(--line); }
  section:last-of-type { border-bottom: 0; }
  section > h2 {
    font: 600 10px/1 "IBM Plex Mono", monospace;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--mut); margin: 0 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  section > h2::before {
    content: ""; width: 4px; height: 4px; border-radius: 50%;
    background: var(--line-2); flex: none;
  }

  /* ---------- contrôles ---------- */
  input[type=text], input[type=number], select {
    width: 100%; background: var(--raised); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--r);
    padding: 8px 10px; font: inherit; transition: border-color .12s;
  }
  input[type=text]:hover, select:hover { border-color: var(--line-2); }
  input[type=text]:focus, select:focus {
    outline: none; border-color: var(--acc);
    box-shadow: 0 0 0 3px rgba(200, 240, 78, .13);
  }
  select {
    cursor: pointer; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--mut) 50%),
                      linear-gradient(135deg, var(--mut) 50%, transparent 50%);
    background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
    padding-right: 28px;
  }
  input[type=color] {
    width: 34px; height: 24px; padding: 0; border: 1px solid var(--line-2);
    border-radius: 6px; background: none; cursor: pointer;
  }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 4px; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=range] { width: 116px; accent-color: var(--acc); }
  input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--acc); cursor: pointer; }

  /* fichier : l'input natif est masqué derrière un vrai bouton */
  .file { position: relative; display: block; }
  .file input[type=file] {
    position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer;
  }
  .file span {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border: 1px dashed var(--line-2); border-radius: var(--r);
    color: var(--mut); font-size: 12.5px; transition: .12s;
  }
  .file:hover span { border-color: var(--acc); color: var(--ink); }

  button {
    width: 100%; padding: 10px 12px; border: 0; border-radius: var(--r);
    background: var(--acc); color: var(--acc-ink);
    font: 600 13.5px "Archivo", sans-serif; cursor: pointer; transition: .12s;
  }
  button:hover { filter: brightness(1.07); }
  button:disabled { opacity: .45; cursor: default; filter: none; }
  button.ghost {
    background: var(--raised); color: var(--ink);
    border: 1px solid var(--line); font-weight: 500; font-size: 12.5px;
    padding: 8px 12px; margin-top: 7px;
  }
  button.ghost:hover { border-color: var(--line-2); background: #1B1F25; }

  .opt {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 6px 0; font-size: 13px;
  }
  .opt > span { color: var(--mut); }
  .opt--select select, .opt--text input { max-width: 168px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .grid label {
    font: 600 9.5px/1 "IBM Plex Mono", monospace; letter-spacing: .14em;
    text-transform: uppercase; color: var(--mut); display: block; margin-bottom: 5px;
  }
  .grid .full { grid-column: 1 / -1; }

  .muted { color: var(--mut); font-size: 12px; }
  .muted a { color: var(--acc); }
  .ok { color: var(--ok); }
  .warn { color: #FFB454; }
  #gpx-err { color: var(--danger); font-size: 12px; margin-top: 7px; }
  #video-state, #bgvideo-state { font-size: 11.5px; color: var(--mut); margin-top: 7px; }

  /* fiche de l'activité chargée */
  #summary {
    background: var(--raised); border: 1px solid var(--line);
    border-radius: var(--r); padding: 11px 12px; margin: 11px 0 0;
    font-size: 12.5px; color: var(--mut); line-height: 1.65;
  }
  #summary strong { color: var(--ink); font-size: 14px; font-weight: 600; }
  #summary .figs { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; }

  details summary {
    cursor: pointer; color: var(--mut); font-size: 12px; margin: 11px 0 8px;
    list-style: none; user-select: none;
  }
  details summary::before { content: "+ "; font-family: monospace; }
  details[open] summary::before { content: "– "; }
  details summary:hover { color: var(--ink); }

  /* pied de la colonne : les exports, toujours atteignables */
  .dock {
    flex: none; border-top: 1px solid var(--line);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: var(--panel);
  }
  .dock .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .dock .row select { flex: 1; }

  /* ---------- scène ---------- */
  #stage {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 18px;
    min-width: 0; min-height: 0; overflow: hidden;
    background:
      radial-gradient(1200px 600px at 50% 0%, #101318 0%, transparent 70%),
      var(--bg);
  }
  #sheet {
    position: relative; line-height: 0;
    border-radius: 3px;
    box-shadow: 0 24px 70px rgba(0,0,0,.65), 0 0 0 1px var(--line);
    background-position: center; background-size: cover;
  }
  #sheet.damier {
    background-image: repeating-conic-gradient(#d9d9d9 0% 25%, #f4f4f4 0% 50%);
    background-size: 24px 24px;
  }
  #sheet.claire { background-image: linear-gradient(160deg, #fdfcf8 0%, #e8e4d8 55%, #fbf7ef 100%); }
  #sheet.sombre { background-image: linear-gradient(160deg, #2a3038 0%, #12151a 60%, #0a0c10 100%); }
  canvas { display: block; position: relative; border-radius: 3px; }
  /* État vide : tant qu'aucune sortie n'est chargée, montrer ce qu'il faut
     faire plutôt qu'une activité inventée que personne n'a parcourue. */
  #empty {
    display: none; max-width: 320px; text-align: center; color: var(--mut);
    flex-direction: column; align-items: center; gap: 10px; line-height: 1.6;
  }
  #empty svg { color: var(--line-2); }
  #empty p { margin: 0; font-size: 13px; }
  #empty strong { color: var(--ink); font-weight: 600; font-size: 14.5px; }
  #empty em { font-style: normal; color: var(--ink); }
  body.vide #empty { display: flex; }
  body.vide #sheet, body.vide #stage .caption { display: none; }

  #stage .caption {
    font: 400 11px "IBM Plex Mono", monospace; color: var(--mut);
    letter-spacing: .1em; text-transform: uppercase;
  }

  /* Fenêtre étroite : la colonne de 330 px ne laisserait plus rien à
     l'aperçu. On empile au lieu de déborder. */
  @media (max-width: 900px) {
    main { flex-direction: column; }
    aside {
      width: 100%; max-height: 52vh;
      border-right: 0; border-bottom: 1px solid var(--line);
    }
    #stage { min-height: 42vh; padding: 12px; }
    header .sub { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="mark"></div>
  <h1>Strava Studio</h1>
  <span class="sub">tes données, tes templates, ton code</span>
  <div class="spacer"></div>
  <span class="sub" id="header-note"></span>
</header>

<main>
  <aside>
    <div class="scroll">

      <section>
        <h2>Activité</h2>
        <div id="strava">
          <div id="strava-state" class="muted">Strava — vérification…</div>
          <select id="strava-list" style="margin-top: 9px; display: none"></select>
          <button class="ghost" id="strava-refresh" type="button" style="display: none">Rafraîchir la liste</button>
        </div>
        <label class="file" style="margin-top: 11px">
          <input type="file" id="gpx" accept=".gpx,application/gpx+xml,text/xml">
          <span>Charger un fichier GPX</span>
        </label>
        <div id="gpx-err"></div>
        <div id="summary"></div>
        <details>
          <summary>Corriger ou saisir à la main</summary>
          <div class="grid">
            <div class="full"><label for="f-name">Titre</label><input type="text" id="f-name"></div>
            <div><label for="f-dist">Distance (km)</label><input type="text" id="f-dist"></div>
            <div><label for="f-time">Temps</label><input type="text" id="f-time" placeholder="3:26:00"></div>
            <div><label for="f-elev">D+ (m)</label><input type="text" id="f-elev"></div>
          </div>
        </details>
      </section>

      <section>
        <h2>Template</h2>
        <select id="tpl"></select>
        <label class="opt" style="margin-top: 9px"><span>Collection</span>
          <select id="collection"></select>
        </label>
        <div id="collection-note" class="muted" style="font-size: 11.5px; margin: 0 0 4px"></div>
        <div id="opts"></div>
      </section>

      <section>
        <h2>Fond</h2>
        <label class="file">
          <input type="file" id="photo" accept="image/*">
          <span>Charger une photo</span>
        </label>
        <label class="file" style="margin-top: 7px">
          <input type="file" id="bgvideo" accept="video/*">
          <span>Charger une vidéo</span>
        </label>
        <div id="bgvideo-state"></div>
        <label class="opt" style="margin-top: 9px"><span>Aperçu sur</span>
          <select id="ground">
            <option value="damier">Damier (alpha)</option>
            <option value="photo">Photo</option>
            <option value="claire">Fond clair</option>
            <option value="sombre">Fond sombre</option>
          </select>
        </label>
        <button class="ghost" id="photo-clear" type="button">Retirer la photo</button>
      </section>

    </div>

    <div class="dock">
      <div class="row">
        <select id="size">
          <option value="story">Story — 1080 × 1920</option>
          <option value="post">Post — 1080 × 1350</option>
          <option value="carre">Carré — 1080 × 1080</option>
          <option value="paysage">Paysage — 1920 × 1080</option>
        </select>
      </div>
      <button id="export" type="button">Exporter en PNG</button>
      <button class="ghost" id="export-video" type="button">Vidéo — le tracé s’anime</button>
      <button class="ghost" id="export-seq" type="button">Séquence PNG — pour le montage</button>
      <div id="video-state"></div>
    </div>
  </aside>

  <div id="stage">
    <div id="empty">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor"
           stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 14c0-3 2-5 4-5s3 2 5 2 3-3 5-3 2 2 2 4"></path>
        <circle cx="6" cy="18" r="2.4"></circle>
        <circle cx="18" cy="18" r="2.4"></circle>
      </svg>
      <p><strong>Dépose une sortie pour commencer</strong></p>
      <p>Un fichier GPX — depuis Strava, une activité → <em>Exporter en GPX</em>.
         Ou saisis les valeurs à la main.</p>
      <button class="ghost" id="load-example" type="button"
              style="width: auto; margin-top: 6px">Voir avec une sortie d’exemple</button>
    </div>
    <div id="sheet"><canvas id="canvas"></canvas></div>
    <div class="caption" id="stage-caption"></div>
  </div>
</main>

<!-- moteur -->
<script src="src/version.js"></script>
<script src="src/activity.js"></script>
<script src="src/studio.js"></script>
<script src="src/design.js"></script>
<script src="src/overlay.js"></script>
<script src="src/collections.js"></script>
<script src="src/video.js"></script>
<script src="src/zip.js"></script>
<script src="src/share.js"></script>

<!-- templates : ajoute les tiens ici -->
<script src="src/templates/pente.js"></script>
<script src="src/templates/radiale.js"></script>
<script src="src/templates/sommet.js"></script>
<script src="src/templates/editorial.js"></script>
<script src="src/templates/trace.js"></script>
<script src="src/templates/chiffres.js"></script>

<!-- surcouches transparentes -->
<script src="src/templates/ov-filet.js"></script>
<script src="src/templates/ov-profil.js"></script>
<script src="src/templates/ov-trace.js"></script>
<script src="src/templates/ov-ardoise.js"></script>
<script src="src/templates/ov-heros.js"></script>
<script src="src/templates/ov-tranche.js"></script>
<script src="src/templates/ov-sommet.js"></script>

<!-- interface -->
<script src="src/app.js"></script>

<script>
  /* Le service worker n'a de sens qu'en contexte sûr — HTTPS ou localhost.
     Ailleurs (file://, IP du réseau local en clair) on s'en passe : le studio
     fonctionne, il n'est simplement pas installable. */
  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.warn('service worker non enregistré :', e.message);
      });
    });
  }
</script>
</body>
</html>
